<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>CHI Work and Travel — Participant Help</title>
<meta name="description" content="Answers for CHI Work and Travel participants, with your own employer, dates and deadlines.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="mark">
      <img class="mark-lockup" src="assets/chi-work-and-travel.png"
           alt="CHI Work and Travel" width="126" height="27">
    </div>
    <button id="sopen" class="iconbtn" aria-label="Search all topics">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
    </button>
    <div class="viewsw" role="group" aria-label="Choose view">
      <button id="vp" aria-pressed="true">Menu</button>
      <button id="vw" aria-pressed="false">Wiring</button>
    </div>
  </div>
</header>

<main class="shell">
  <div id="participant">
    <div id="idzone"></div>
    <div class="searchwrap" id="searchwrap">
      <div class="search">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
        <input id="s" type="search" placeholder="Search, for example SSN or second job" autocomplete="off" aria-label="Search all help topics">
        <button id="sclear" hidden>Clear</button>
      </div>
    </div>
    <div id="view"></div>
  </div>
  <div id="wiring" class="wire" hidden></div>
</main>

<div class="bar" id="bar">
  <div class="bar-in">
    <button id="portal" data-portal="1">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      <span>I can't log in</span>
    </button>
    <button id="msg">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.9 8.9 0 0 1-4-.9L3 21l1.9-4.9A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5Z"/></svg>
      <span>Message my CHI team</span>
    </button>
  </div>
</div>

<script src="assets/content.js"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
